pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'Tubego'
include ':app'

// Opt-in diagnostic APK; never included in normal app builds.
if (providers.gradleProperty('vlcProbe').isPresent()) {
    include ':vlcProbe'
    project(':vlcProbe').projectDir = file('../docs/spikes/pla257/app')
}

# Operator opt-in overlay: migrate the existing volume to this bind directory FIRST.
# Never mount a Docker socket into API containers.
services:
  api:
    environment:
      TUBEGO_MAINTENANCE_MUTATIONS: "true"
    build:
      args:
        TUBEGO_BUILD_REVISION: ${TUBEGO_BUILD_REVISION:?approved revision required}
        YTDLP_VERSION: ${TUBEGO_YTDLP_VERSION:?approved version required}
    volumes:
      - ${TUBEGO_HOST_DATA_DIR:?existing data directory required}:/data
  worker:
    build:
      args:
        TUBEGO_BUILD_REVISION: ${TUBEGO_BUILD_REVISION}
        YTDLP_VERSION: ${TUBEGO_YTDLP_VERSION}
    volumes:
      - ${TUBEGO_HOST_DATA_DIR}:/data
  retention:
    build:
      args:
        TUBEGO_BUILD_REVISION: ${TUBEGO_BUILD_REVISION}
        YTDLP_VERSION: ${TUBEGO_YTDLP_VERSION}
    volumes:
      - ${TUBEGO_HOST_DATA_DIR}:/data
  egress:
    build:
      args:
        TUBEGO_BUILD_REVISION: ${TUBEGO_BUILD_REVISION}
        YTDLP_VERSION: ${TUBEGO_YTDLP_VERSION}
  maintenance-supervisor:
    build:
      context: .
      dockerfile: backend/Dockerfile.maintenance
    environment:
      TUBEGO_MAINTENANCE_MUTATIONS: "true"
      TUBEGO_BUILD_REVISION: ${TUBEGO_BUILD_REVISION:?approved revision required}
      TUBEGO_YTDLP_VERSION: ${TUBEGO_YTDLP_VERSION:?approved version required}
      TUBEGO_HOST_DATA_DIR: ${TUBEGO_HOST_DATA_DIR:?existing data directory required}
      TUBEGO_REPO_DIR: ${TUBEGO_REPO_DIR:?clean staged repository required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${TUBEGO_REPO_DIR:?clean staged repository required}:/opt/tubego-repo
      - ${TUBEGO_HOST_DATA_DIR:?existing data directory required}:${TUBEGO_HOST_DATA_DIR}
    command:
      - --repo
      - /opt/tubego-repo
      - --project
      - tubego
      - --data-dir
      - ${TUBEGO_HOST_DATA_DIR}
      - --yt-dlp-version
      - ${TUBEGO_YTDLP_VERSION}
    restart: unless-stopped

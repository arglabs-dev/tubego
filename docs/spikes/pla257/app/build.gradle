plugins { id 'com.android.application' }
android {
    namespace 'dev.arglabs.tubego.spike'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.arglabs.tubego.vlcprobe'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    sourceSets {
        main {
            java.srcDirs += ['../android', '../src']
            java.exclude '**/ResumePositionTest.java'
            // Reuse the known synthetic 45-second clip; no user media.
            res.srcDirs += ['../../../../android/app/src/androidTest/res']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
